[project]
name = "jihedailabs-tokenlens"
version = "0.1.0"
description = "Local, offline report of where your AI coding assistant tokens go — no telemetry, multi-tool."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "JihedAiLabs", email = "contact@winnemchi.tn" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
tokenlens = "tokenlens.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tokenlens"]
